name: Discord Commit Notify

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "username": "Fortune Bot Updates",
            "avatar_url": "https://your-image-url-here.png",
            "embeds": [{
              "title": "New Commit — ${{ github.ref_name }}",
              "description": "${{ github.event.head_commit.message }}",
              "url": "${{ github.event.head_commit.url }}",
              "color": 9109504,
              "fields": [
                { "name": "Author", "value": "${{ github.event.head_commit.author.name }}", "inline": true },
                { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true }
              ],
              "footer": { "text": "${{ github.repository }}" }
            }]
          }' \
          $DISCORD_WEBHOOK
