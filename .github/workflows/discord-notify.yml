name: Discord Commit Notify

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          PUSHER: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA::7}"
          COMMIT_URL="$SERVER_URL/$REPO/commit/$SHA"
          REPO_URL="$SERVER_URL/$REPO"
          AVATAR_URL="https://github.com/$PUSHER.png?size=64"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          jq -n \
            --arg username "Fortune Bot Updates" \
            --arg author_name "$PUSHER pushed to $BRANCH" \
            --arg commit_url "$COMMIT_URL" \
            --arg avatar_url "$AVATAR_URL" \
            --arg title "New Commit · $BRANCH" \
            --arg description "$COMMIT_MSG" \
            --argjson color 9109504 \
            --arg short_sha "$SHORT_SHA" \
            --arg repo "$REPO" \
            --arg repo_url "$REPO_URL" \
            --arg author "$AUTHOR_NAME" \
            --arg timestamp "$TIMESTAMP" \
            '{
              username: $username,
              embeds: [{
                author: {
                  name: $author_name,
                  url: $commit_url,
                  icon_url: $avatar_url
                },
                title: $title,
                url: $commit_url,
                description: ("> " + $description),
                color: $color,
                fields: [
                  {
                    name: "🔑  Commit",
                    value: ("[`" + $short_sha + "`](" + $commit_url + ")"),
                    inline: true
                  },
                  {
                    name: "📂  Repository",
                    value: ("[" + $repo + "](" + $repo_url + ")"),
                    inline: true
                  },
                  {
                    name: "✍️  Author",
                    value: $author,
                    inline: true
                  }
                ],
                footer: {
                  text: "Fortune Bot • GitHub Actions",
                  icon_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                },
                timestamp: $timestamp
              }]
            }' | curl -s -X POST "$DISCORD_WEBHOOK" \
                -H "Content-Type: application/json" \
                -d @-
